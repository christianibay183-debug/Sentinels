{% extends "base.html" %}
{% block title %}Logs — CCTV System{% endblock %}
{% block page_title %}SYSTEM LOGS{% endblock %}
 
{% block extra_head %}
<style>
  .log-controls {
    display:flex; gap:12px; margin-bottom:20px; align-items:center; flex-wrap:wrap;
  }
  .log-controls input {
    flex:1; min-width:200px;
    background:var(--panel2); border:1px solid var(--border);
    color:var(--text); font-family:'Share Tech Mono',monospace;
    font-size:0.83rem; padding:9px 14px; outline:none;
  }
  .log-controls input:focus { border-color:var(--accent); }
  .filter-btn {
    padding:9px 16px; border:1px solid var(--border);
    background:transparent; color:var(--dim);
    font-family:'Share Tech Mono',monospace; font-size:0.72rem;
    letter-spacing:2px; cursor:pointer; transition:all 0.2s;
  }
  .filter-btn.active, .filter-btn:hover {
    border-color:var(--accent); color:var(--accent);
    background:rgba(0,229,255,0.07);
  }
  .filter-btn.red.active, .filter-btn.red:hover {
    border-color:var(--accent2); color:var(--accent2);
    background:rgba(255,68,68,0.07);
  }
  .log-panel {
    background:var(--panel2); border:1px solid var(--border);
    max-height:65vh; overflow-y:auto;
    font-family:'Share Tech Mono',monospace; font-size:0.78rem;
  }
  .log-line {
    display:flex; gap:14px; padding:10px 16px;
    border-bottom:1px solid rgba(26,58,92,0.3);
    align-items:center; transition:background 0.1s;
  }
  .log-line:hover { background:rgba(0,229,255,0.03); }
  .log-date { color:var(--dim); white-space:nowrap; font-size:0.70rem; min-width:90px; }
  .log-time { color:var(--accent); white-space:nowrap; font-size:0.72rem; min-width:75px; }
  .log-icon { font-size:1rem; min-width:20px; text-align:center; }
  .log-msg { color:var(--text); flex:1; }
  .tag {
    font-size:0.65rem; letter-spacing:1px; padding:2px 7px;
    border-radius:2px; font-weight:700; white-space:nowrap;
  }
  .tag-success { background:rgba(0,255,136,0.1); color:var(--green); border:1px solid var(--green); }
  .tag-failed  { background:rgba(255,68,68,0.1); color:var(--accent2); border:1px solid var(--accent2); }
  .tag-stream  { background:rgba(0,229,255,0.1); color:var(--accent); border:1px solid var(--accent); }
  .tag-view    { background:rgba(255,255,255,0.05); color:var(--dim); border:1px solid var(--border); }
  .tag-logout  { background:rgba(255,200,0,0.1); color:var(--yellow); border:1px solid var(--yellow); }
  .log-stats {
    display:grid; grid-template-columns:repeat(3,auto); gap:20px;
    margin-bottom:20px; width:fit-content;
  }
  .ls { font-family:'Share Tech Mono',monospace; font-size:0.72rem; }
  .ls .lv { font-size:1.5rem; font-weight:700; }
  .ls .lk { color:var(--dim); letter-spacing:2px; }
  .lv.cyan { color:var(--accent); }
  .lv.red  { color:var(--accent2); }
  .lv.green{ color:var(--green); }
  .no-logs { padding:40px; text-align:center; color:var(--dim); font-family:'Share Tech Mono',monospace; font-size:0.8rem; letter-spacing:2px; }
</style>
{% endblock %}
 
{% block content %}
<div class="log-stats">
  <div class="ls"><div class="lv cyan" id="total-count">0</div><div class="lk">TOTAL</div></div>
  <div class="ls"><div class="lv red"  id="error-count">0</div><div class="lk">FAILED</div></div>
  <div class="ls"><div class="lv green" id="login-count">0</div><div class="lk">LOGINS</div></div>
</div>
 
<div class="log-controls">
  <input type="text" id="log-search" placeholder="SEARCH LOGS..." oninput="filterLogs()"/>
  <button class="filter-btn active" onclick="setFilter('ALL',this)">ALL</button>
  <button class="filter-btn" onclick="setFilter('LOGIN',this)">LOGIN</button>
  <button class="filter-btn" onclick="setFilter('STREAM',this)">STREAM</button>
  <button class="filter-btn red" onclick="setFilter('FAILED',this)">FAILED</button>
</div>
 
<div class="log-panel" id="log-panel">
  <div class="no-logs" id="no-logs-msg" style="display:none;">NO LOG ENTRIES YET</div>
</div>
{% endblock %}
 
{% block extra_scripts %}
<script>
const rawLines = {{ lines | tojson }};
 
let activeFilter = 'ALL';
 
function parseLines(lines) {
  const panel = document.getElementById('log-panel');
  const noMsg = document.getElementById('no-logs-msg');
  panel.innerHTML = '';
  panel.appendChild(noMsg);
 
  let count = 0, errors = 0, logins = 0;
 
  lines.forEach(line => {
    if (!line.includes('USER=') || !line.includes('IP=')) return;
 
    const parts = line.split(' | ');
    const ts = parts[0] || '';
    const tsParts = ts.split(' ');
    const logDate = tsParts[0] || '';
    const logTime = tsParts[1] ? tsParts[1].split(',')[0] : '';
 
    let user = '';
    parts.forEach(p => {
      if (p.startsWith('USER=')) user = p.replace('USER=', '').trim();
    });
 
    let icon, msg, tagClass, tagText, type;
 
    if (line.includes('LOGIN_SUCCESS')) {
      icon='🟢'; msg=`<b>${user}</b> logged in successfully`; tagClass='tag-success'; tagText='SUCCESS'; type='login'; logins++;
    } else if (line.includes('LOGIN_FAILED')) {
      icon='🔴'; msg=`Failed login attempt for <b>${user}</b>`; tagClass='tag-failed'; tagText='FAILED'; type='failed'; errors++;
    } else if (line.includes('LOGOUT')) {
      icon='🟡'; msg=`<b>${user}</b> logged out`; tagClass='tag-logout'; tagText='LOGOUT'; type='logout';
    } else if (line.includes('STREAM_ACCESS')) {
      icon='📷'; msg=`<b>${user}</b> viewed live camera stream`; tagClass='tag-stream'; tagText='STREAM'; type='stream';
    } else if (line.includes('VIEW_DASHBOARD')) {
      icon='🖥️'; msg=`<b>${user}</b> opened the dashboard`; tagClass='tag-view'; tagText='DASHBOARD'; type='view';
    } else if (line.includes('VIEW_FOOTAGE')) {
      icon='🎞️'; msg=`<b>${user}</b> browsed footage`; tagClass='tag-view'; tagText='FOOTAGE'; type='view';
    } else if (line.includes('DOWNLOAD_FOOTAGE')) {
      icon='⬇️'; msg=`<b>${user}</b> downloaded a footage file`; tagClass='tag-view'; tagText='DOWNLOAD'; type='view';
    } else if (line.includes('VIEW_LOGS')) {
      icon='📋'; msg=`<b>${user}</b> viewed system logs`; tagClass='tag-view'; tagText='LOGS'; type='view';
    } else {
      return;
    }
 
    const div = document.createElement('div');
    div.className = 'log-line';
    div.dataset.raw = line;
    div.dataset.type = type;
    div.innerHTML = `
      <span class="log-date">${logDate}</span>
      <span class="log-time">${logTime}</span>
      <span class="log-icon">${icon}</span>
      <span class="log-msg">${msg}</span>
      <span class="tag ${tagClass}">${tagText}</span>
    `;
    panel.appendChild(div);
    count++;
  });
 
  document.getElementById('total-count').textContent = count;
  document.getElementById('error-count').textContent = errors;
  document.getElementById('login-count').textContent = logins;
  noMsg.style.display = count === 0 ? '' : 'none';
}
 
function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterLogs();
}
 
function filterLogs() {
  const q = document.getElementById('log-search').value.toLowerCase();
  const rows = document.querySelectorAll('.log-line');
  let visible = 0;
  rows.forEach(r => {
    const raw = r.dataset.raw.toLowerCase();
    const type = r.dataset.type || '';
    const text = r.textContent.toLowerCase();
    const matchQ = q === '' || raw.includes(q) || text.includes(q);
    const matchF = activeFilter === 'ALL'
      || (activeFilter === 'LOGIN'  && (type === 'login' || type === 'logout'))
      || (activeFilter === 'STREAM' && type === 'stream')
      || (activeFilter === 'FAILED' && type === 'failed');
    const show = matchQ && matchF;
    r.style.display = show ? '' : 'none';
    if (show) visible++;
  });
  document.getElementById('total-count').textContent = visible;
}
 
parseLines(rawLines);
setInterval(() => location.reload(), 15000);
</script>
{% endblock %}
