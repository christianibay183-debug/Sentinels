<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sentinels — Secure Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050a0f;
    --panel: #0a1520;
    --border: #1a3a5c;
    --accent: #1a6fd4;
    --accent2: #ff4444;
    --text: #c8d8e8;
    --dim: #4a6a8a;
    --glow: 0 0 20px rgba(26,111,212,0.3);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    font-family: 'Rajdhani', sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .grid-bg {
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .scanline {
    position: fixed; top: 0; left: 0; width: 100%; height: 3px;
    background: rgba(0,229,255,0.15);
    animation: scan 4s linear infinite;
    z-index: 1;
  }
  @keyframes scan { 0%{top:0} 100%{top:100%} }

  .login-box {
    position: relative; z-index: 2;
    width: 420px;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 0;
    clip-path: polygon(0 0, calc(100% - 24px) 0, 100% 24px, 100% 100%, 24px 100%, 0 calc(100% - 24px));
    box-shadow: var(--glow), inset 0 0 40px rgba(0,229,255,0.03);
  }
  .login-header {
    background: linear-gradient(135deg, rgba(0,229,255,0.1), transparent);
    border-bottom: 1px solid var(--border);
    padding: 28px 36px 24px;
    text-align: center;
  }
  .cam-icon { font-size: 2.4rem; margin-bottom: 10px; display: block; }
  .login-header h1 {
    font-family: 'Share Tech Mono', monospace;
    font-size: 1.3rem;
    letter-spacing: 4px;
    color: var(--accent);
    text-shadow: var(--glow);
  }
  .login-header .sub {
    font-size: 0.8rem;
    color: var(--dim);
    letter-spacing: 2px;
    margin-top: 4px;
    font-family: 'Share Tech Mono', monospace;
  }
  .login-body { padding: 32px 36px; }
  .field { margin-bottom: 22px; }
  .field label {
    display: block;
    font-size: 0.72rem;
    letter-spacing: 3px;
    color: var(--dim);
    margin-bottom: 8px;
    font-family: 'Share Tech Mono', monospace;
  }
  .field input {
    width: 100%;
    background: rgba(0,229,255,0.04);
    border: 1px solid var(--border);
    border-bottom-color: var(--accent);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 1rem;
    padding: 12px 14px;
    outline: none;
    transition: all 0.2s;
  }
  .field input:focus {
    border-color: var(--accent);
    box-shadow: var(--glow);
    background: rgba(0,229,255,0.07);
  }
  .error-msg {
    background: rgba(255,68,68,0.1);
    border: 1px solid rgba(255,68,68,0.4);
    color: var(--accent2);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.78rem;
    padding: 10px 14px;
    margin-bottom: 20px;
    letter-spacing: 1px;
  }
  .btn-login {
    width: 100%;
    background: linear-gradient(135deg, rgba(0,229,255,0.15), rgba(0,229,255,0.05));
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.9rem;
    letter-spacing: 4px;
    padding: 14px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  .btn-login:hover {
    background: rgba(0,229,255,0.2);
    box-shadow: var(--glow);
    transform: translateY(-1px);
  }
  .status-bar {
    display: flex; justify-content: space-between;
    padding: 12px 36px;
    border-top: 1px solid var(--border);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    color: var(--dim);
  }
  .dot { width:8px; height:8px; border-radius:50%; background:#22ff88; display:inline-block; margin-right:6px; animation: blink 1.5s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="scanline"></div>
<div class="login-box">
  <div class="login-header">
    <span class="cam-icon">📷</span>
    <h1>SENTINELS</h1>
    <div class="sub">SURVEILLANCE SYSTEM</div>
  </div>
  <div class="login-body">
    {% if error %}
    <div class="error-msg">⚠ {{ error }}</div>
    {% endif %}
    <form method="POST">
      <div class="field">
        <label>OPERATOR ID</label>
        <input type="text" name="username" autocomplete="username" required placeholder="Enter username"/>
      </div>
      <div class="field">
        <label>ACCESS CODE</label>
        <input type="password" name="password" autocomplete="current-password" required placeholder="••••••••"/>
      </div>
      <button class="btn-login" type="submit">AUTHENTICATE</button>
    </form>
  </div>
  <div class="status-bar">
    <span><span class="dot"></span>SYSTEM ONLINE</span>
    <span id="clock"></span>
  </div>
</div>
<script>
  const c=document.getElementById('clock');
  setInterval(()=>{ c.textContent=new Date().toLocaleTimeString('en-GB',{hour12:false}); },1000);
</script>
</body>
</html>
